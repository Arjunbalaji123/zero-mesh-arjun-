[project]
name = "zeromesh"
version = "0.1.0"
description = "Decentralized Peer-to-Peer Encrypted File System"
authors = [{ name = "shivesh" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    # Cryptography (AES-256-GCM, SHA-256, Argon2id)
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    # REST API
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    # Database (local chunk index)
    "aiosqlite>=0.20",
    # Serialization (binary protocol)
    "msgpack>=1.0",
    # CLI
    "typer[all]>=0.12",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Metrics & logging
    "prometheus-client>=0.20",
    "structlog>=24.1",
    # Utilities
    "rich>=13.7",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # for FastAPI test client
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
zeromesh = "zeromesh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zeromesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
